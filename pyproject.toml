[project]
name = "sitescout"
version = "0.1.0"
description = "EV charging network intelligence for Rwanda: an independent portfolio project built on public data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abualgasim Ibrahim" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.1.4",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Copy package files into .venv instead of hard-linking them from uv's cache (the Windows
# default), so .venv never shares files with the cache. Added under D-003; kept unchanged
# after the repository moved to a local folder, to avoid changing install behaviour.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# T20 bans print(): pipelines log instead of printing (CLAUDE.md).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "T20"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
