# SiteScout settings.
#
# Every value comes from docs/SPEC.md (the section is noted on each block), except the
# paths and the log level, which CLAUDE.md requires to live here. A parameter that SPEC.md
# requires but does not define is written as `pending` with the reason. It has no default:
# code that reads it stops with an error, and overrides cannot fill it.
#
# Paths are relative to the repository root. Distances are in metres.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  manual_chargers_csv: data/manual/chargers.csv
  export_json: data/export/sitescout.json
  evaluation_report: reports/evaluation.md

logging:
  level: INFO

# SPEC §2
crs:
  storage: "EPSG:4326"
  metric: "EPSG:32735"

# SPEC §2. Each `download` block was verified on 2026-09-24 (docs/data_sources.md, D-016).
# versioning: fixed   = the URL names one release; a changed file on re-download is an error.
# versioning: rolling = the URL is replaced upstream over time; each change is logged and the
#                       new SHA-256 and upstream timestamp are recorded.
sources:
  osm:
    provider: Geofabrik
    extract: rwanda-latest.osm.pbf
    download:
      url: https://download.geofabrik.de/africa/rwanda-latest.osm.pbf
      versioning: rolling
      licence: ODbL-1.0
      licence_url: https://www.openstreetmap.org/copyright
      credit: "© OpenStreetMap contributors"
  population:
    provider: WorldPop
    year: 2025
    resolution_m: 100
    constrained: true
    release: R2025A
    # Retrieved fact: the "100 m" grid is 3 arc-seconds in EPSG:4326 (WorldPop metadata).
    pixel_size_arcsec: 3
    download:
      url: https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2025/RWA/v1/100m/constrained/rwa_pop_2025_CN_100m_R2025A_v1.tif
      versioning: fixed
      licence: CC-BY-4.0
      licence_url: https://hub.worldpop.org/data/licence.txt
      credit: "WorldPop, University of Southampton (2025). Constrained population estimates, R2025A v1. DOI 10.5258/SOTON/WP00839"
  elevation:
    provider: Copernicus DEM
    product: GLO-30
    status: deferred
  boundaries:
    provider: geoBoundaries
    iso3: RWA
    master_level: ADM2
    derived_levels: [ADM1, ADM0]
    # Retrieved facts (geoBoundaries API admUnitCount); a different count stops ingestion.
    expected_units:
      ADM2: 30
      ADM1: 5
    # Pinned to geoBoundaries commit 9469f09. ADM1 is used only to assign each district to
    # a province by overlap; ADM1 and ADM0 geometry is always dissolved from ADM2.
    downloads:
      ADM2:
        url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/RWA/ADM2/geoBoundaries-RWA-ADM2.geojson
        versioning: fixed
        licence: CC-BY-4.0
        licence_url: https://creativecommons.org/licenses/by/4.0/
        credit: "geoBoundaries (Runfola et al. 2020), gbOpen RWA ADM2; source: Open Data Rwanda (NISR)"
      ADM1:
        url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/RWA/ADM1/geoBoundaries-RWA-ADM1.geojson
        versioning: fixed
        licence: CC-BY-4.0
        licence_url: https://creativecommons.org/licenses/by/4.0/
        credit: "geoBoundaries (Runfola et al. 2020), gbOpen RWA ADM1; source: The Rwanda Geo Portal"
  grid_cross_check:
    provider: energydata.info
    dataset: Rwanda transmission network
    data_year: 2009
    use: cross_check_only
    download:
      url: https://datacatalogfiles.worldbank.org/ddh-published/0042268/1/DR0052867/rwanda-electricity-transmission-network.zip
      versioning: fixed
      licence: CC-BY-4.0
      licence_url: https://creativecommons.org/licenses/by/4.0/
      credit: "World Bank Group, Rwanda Electricity Transmission Network, via energydata.info"
  osm_tags:
    charging_station: "amenity=charging_station"
    fuel_station_sockets: "socket:*"
    grid: "power=*"
    water: "natural=water"
    protected_area: "boundary=protected_area"
    # SPEC §3 excludes protected areas; OSM also tags national parks (Nyungwe, Volcanoes)
    # boundary=national_park, with an IUCN protect_class. Same rule, same source (D-026).
    national_park: "boundary=national_park"
    # Milestone 1 extraction scope (D-019). Roads keep every highway value: the drivable
    # classes are decided in M2. POIs are a broad superset of tagged places, not host types:
    # host classification is decided in M2 (candidates.host_osm_tags).
    roads: "highway=*"
    pois:
      - "amenity=*"
      - "shop=*"
      - "tourism=*"
      - "office=*"
      - "industrial=*"
      - "landuse=industrial"
      - "landuse=commercial"
      - "landuse=retail"
      - "building=warehouse"
      - "building=industrial"
      - "building=commercial"
      - "building=retail"
      - "man_made=works"
    # Milestone 3 (D-035): town and city centre nodes for dist_town_m and the Kigali city
    # centre. Only nodes are extracted; names are never read.
    places: ["place=city", "place=town"]
  charger_csv:
    columns: [name, lat, lon, source_url, date_retrieved, operator_public_name]
    provenance_only_columns: [operator_public_name]
  # Decided by Gasim on 2026-09-25 (D-034): charger records within this distance are one
  # charging site, within a source (OSM maps one site as three nodes 10 m apart) and between
  # the manual CSV and OSM. A project data-matching choice, not a definition of a site.
  charger_match_radius_m: 50

# Milestone 1 ingestion checks (not from SPEC; D-018).
ingest:
  # Rwanda envelope in EPSG:4326: the union of the geoBoundaries ADM2 extent and the
  # Geofabrik extract box (both retrieved 2026-09-24), rounded outward to 0.01 degrees.
  rwanda_bbox:
    min_lon: 28.85
    min_lat: -2.85
    max_lon: 30.91
    max_lat: -1.03

# SPEC §3
candidates:
  target_count:
    min: 200
    max: 400
  # Candidate budget (D-031, decided by Gasim on 2026-09-24): the eligible candidates are
  # reduced to exactly this many by ADM2 district quotas and priority-ordered spacing. It
  # must lie within target_count.
  budget:
    size: 300
  host_types: [fuel, mall, supermarket, logistics, industrial, hotel]
  dedup:
    radius_m: 300
    host_priority: [fuel, mall, supermarket, logistics, industrial, hotel, none]
  corridor:
    spacing_m: 10000
    road_classes: [trunk, primary]
    host_snap_radius_m: 2000
  filters:
    max_road_distance_m: 500
    exclude_areas: [water, protected_area]
  # Decided 2026-09-24 (D-027). Standard OSM tags per host type; each must fall inside the
  # M1 POI extraction scope (sources.osm_tags.pois). No restaurants.
  host_osm_tags:
    fuel: ["amenity=fuel"]
    mall: ["shop=mall"]
    supermarket: ["shop=supermarket"]
    logistics: ["building=warehouse", "industrial=depot", "industrial=intermodal_freight_terminal"]
    industrial: ["landuse=industrial", "man_made=works"]
    hotel: ["tourism=hotel"]
  # Decided 2026-09-24 (D-028): OSM highway values for car roads; tracks, paths and footways
  # are not drivable here.
  drivable_road_classes:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
    - tertiary
    - tertiary_link
    - unclassified
    - residential
    - living_street
    - service
    - road
  # Decided by Gasim on 2026-09-25 (D-039): urban if within kigali_radius_m of the Kigali
  # city centre (features.kigali_cbd) or within town_radius_m of any town or city centre
  # (features.town_centres); otherwise corridor. Both inclusive.
  profile:
    town_radius_m: 3000
    kigali_radius_m: 10000

# SPEC §4
features:
  population_radii_m: [1000, 5000, 10000]
  poi_radii_m: [1000, 3000]
  charger_count_radii_m: [10000, 25000]
  # outside_rwanda_share_10km is a border diagnostic (D-036). Elevation and slope are
  # deferred with their source (SPEC §2, D-037) and are not computed.
  reported_only: [dist_town_m, dist_kigali_cbd_m, outside_rwanda_share_10km, elevation, slope]
  # Milestone 3 decisions by Gasim on 2026-09-25 (D-032 to D-036).
  # D-032: the "trunk corridor" of dist_trunk_m. Must be drivable classes.
  trunk_road_classes: [trunk, trunk_link]
  # D-035: every OSM place=city and place=town node inside Rwanda is a town or city centre.
  town_centres: ["place=city", "place=town"]
  # D-035: the OSM place=city node for Kigali (capital=yes; in Gasabo district by the ADM2
  # boundaries), verified in the 2026-09-23 extract. Not an official CBD boundary.
  kigali_cbd:
    osm_id: node/60485579
    label: "Kigali city centre as mapped in OSM"
  # D-033: one POI type per OSM key. A POI matching several types counts once in poi_1km
  # and poi_3km. Excluded in both modes: charging stations (J). A candidate's own host is
  # never counted for it (K).
  poi_types:
    amenity: ["amenity=*"]
    shop: ["shop=*"]
    tourism: ["tourism=*"]
    office: ["office=*"]
    industrial: ["industrial=*"]
  poi_exclude: ["amenity=charging_station"]
  # D-033: which power=* values are grid evidence. No other power value is ever counted.
  grid_osm_tags:
    substation: ["power=substation"]
    line: ["power=line", "power=minor_line", "power=cable"]
    completeness:
      - "power=line"
      - "power=minor_line"
      - "power=cable"
      - "power=substation"
      - "power=transformer"
      - "power=tower"
      - "power=pole"
      - "power=portal"
      - "power=plant"
      - "power=generator"
      - "power=connection"
  # D-034: which records are existing chargers in production mode.
  chargers:
    exclude_access: [private, "no"]
    fuel_sockets_count_as_chargers: true

# SPEC §5 (feature weights, profile weights and bonuses are in config/weights.yaml)
scoring:
  scale_max: 100
  grid_evidence:
    missing_radius_m: 5000
    missing_component_score: 0
  # D-040: the skewed counts SPEC §5 applies log1p to before ranking. log1p keeps the
  # order of values, so it changes no percentile rank; it is kept because SPEC asks for it.
  log1p_features: [poi_1km, poi_3km, chargers_10km, chargers_25km]
  # D-040: "lower is better" features, inverted explicitly as 100 - percentile (SPEC §5).
  lower_is_better:
    - dist_road_m
    - dist_trunk_m
    - dist_substation_m
    - dist_line_m
    - chargers_10km
    - chargers_25km

# SPEC §6
confidence:
  grid_evidence_missing_level: Low
  # Decided by Gasim on 2026-09-25 (D-041). Sparse public-map coverage: the district's
  # grid_completeness_ratio is below this value (half the national median).
  sparse_coverage_threshold: 0.5
  # Remote: no more than this many mapped POIs within 3 km to cross-check against.
  remote_location_rule:
    max_poi_3km: 0
  # Without missing grid evidence, the level follows the number of other factors (sparse
  # coverage, no host, remote): 0 -> High, 1 -> Medium, 2 or more -> the last entry.
  factor_count_levels: [High, Medium, Low]
  universal_unknowns:
    - grid connection capacity
    - transformer capacity
    - land availability
    - landowner willingness
    - permit requirements

# SPEC §7
evaluation:
  label: retrospective plausibility test
  backtest:
    hit_radius_m: 1000
    precision_at: [10, 20, 30]
    recall_at: 30
  random_baseline_seeds: 1000
  random_seed:
    pending: "SPEC §7 and CLAUDE.md require fixed random seeds but give no seed value. Decide in M5."
  bootstrap:
    resamples:
      pending: "SPEC §7 requires bootstrap confidence intervals but gives no number of resamples. Decide in M5."
    confidence_level:
      pending: "SPEC §7 requires bootstrap confidence intervals but gives no confidence level. Decide in M5."
  stability:
    perturbation: 0.20
    renormalize: true
    top_k: 30
    min_overlap: 0.70
  grounding_target: 1.0

# SPEC §8
optimization:
  demand_h3_resolution: 7
  service_radius_m: 10000
  n_sites: 30
  lambda: 0.01
  min_spacing_m: 2000
  min_score_percentile: 50
  existing_charger_demand_factor: 0.5
  time_limit_s: 300
  sensitivity:
    pending: "SPEC §8 varies lambda, the service radius and the existing-charger factor without giving the values to try. Decide in M6."

# SPEC §10
export:
  boundary_geojson_max_kb: 300
