  - id: O03
    category: out_of_scope
    author: assistant
    query: "Which brand of charger hardware should be installed at a fuel station?"
    relevant: []
    note: Equipment and brands are not covered.

  - id: O04
    category: out_of_scope
    author: assistant
    query: "How do I deploy this application to a cloud provider?"
    relevant: []
    note: Deployment is not covered.

  - id: O05
    category: out_of_scope
    author: assistant
    query: "What is the current electricity tariff per kilowatt-hour in Rwanda?"
    relevant: []
    note: Tariffs are not in the public data SiteScout uses.

  - id: O06
    category: out_of_scope
    author: assistant
    query: "How many electric cars are registered in Rwanda today?"
    relevant: []
    note: Vehicle registrations are not covered.
