# Milestone 10, Phase 4 (D-058): the fixed, auditable case set for the agent's grounding rules and
# loop. Each case is one scripted provider trajectory run through the production agent loop
# (src/sitescout/agent_eval). No model, API or network is involved.
#
# `provider` lists the steps in order: a tool call, a final answer (the raw JSON the loop parses)
# or a provider failure; `times` repeats a step. `{{display|<record id>}}` and `{{first_site|}}`
# are filled from the tool outputs the provider has been shown, so no value is typed by hand.
# Quotations are literal and must stay verbatim in the current documents.
#
# `expect.decision` is the ground truth for the answer's first attempt (accept: it is supported;
# reject: it is not). Where the validator is documented to get a case wrong (D-058), the case
# says so in `known_limit` and pins what the validator actually does in `validator_decision`.
# `kind: adversarial` marks an answer built to break a rule; `legitimate` one that should pass.
# The world is the SYNTHETIC test world: candidates cand-a (rank 1, the one network site),
# cand-b (a corridor point) and cand-c.

version: 1
world: "SYNTHETIC test world (3 candidates, 1 network site) with the real knowledge index"

cases:
  # --- A: knowledge only ----------------------------------------------------------------------
  - id: A01
    category: A
    tags: [knowledge_quote]
    title: A knowledge claim with a verbatim quotation
    kind: legitimate
    question: "What does SiteScout say it does not claim?"
    provider:
      - {tool: search_knowledge, arguments: {query: "what it does not claim", doc_type: overview}}
      - answer:
          direct_answer:
            - text: "The project documentation lists what SiteScout does not claim."
              kind: RETRIEVED_FACT
              evidence_ids: [kb/readme/what-it-does-not-claim]
              quotes: ["never claims grid approval, transformer capacity"]
    expect: {decision: accept, status: answered, termination: answered, trajectory: [search_knowledge]}

  - id: A02
    category: A
    tags: [knowledge_quote]
    title: A quotation of exactly the minimum length passes
